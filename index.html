<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Giliran Rawatan Klinik</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f0fdfa;padding:1rem}
.container{max-width:450px;margin:0 auto}
.header{background:#0d9488;color:#fff;padding:1.2rem;text-align:center;border-radius:0 0 1rem 1rem;margin-bottom:1.5rem}
.nav{display:flex;justify-content:center;gap:1rem;margin-bottom:1.5rem}
.nav button{background:transparent;border:none;color:#0d9488;padding:0.5rem 1rem;cursor:pointer;font-size:1rem;text-decoration:underline}
.card{background:#fff;border-radius:1rem;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
h2{color:#0d9488;margin-bottom:1rem;text-align:center}
.form-group{margin-bottom:1rem}
label{display:block;margin-bottom:0.5rem;font-weight:600}
input{width:100%;padding:0.8rem;border:1px solid #ddd;border-radius:0.5rem;font-size:1rem}
button.primary{width:100%;padding:0.9rem;border:none;border-radius:0.5rem;background:#0d9488;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:0.5rem}
.result{text-align:center;margin-top:1.5rem;display:none}
.ticket-no{font-size:3rem;font-weight:bold;color:#0d9488;margin:1rem 0}
.hidden{display:none !important}
.qr-section{text-align:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid #eee}
</style>
</head>
<body>

<div class="header"><h1>Sistem Giliran Rawatan Klinik</h1></div>
<div class="container">
  <div class="nav">
    <button onclick="showTab('daftar')">Daftar Pesakit</button>
    <button onclick="showTab('semak')">Semak Tiket</button>
  </div>

  <div id="tab-daftar" class="card">
    <h2>Daftar Giliran</h2>
    <form id="form-daftar">
      <div class="form-group">
        <label>Nama Pesakit</label>
        <input type="text" id="nama-pesakit" placeholder="Masukkan nama anda">
      </div>
      <button type="submit" class="primary">Dapatkan Nombor Giliran</button>
    </form>
    <div id="hasil-daftar" class="result">
      <p>Nombor Giliran Anda:</p>
      <div class="ticket-no" id="nombor-keluar"></div>
      <button type="button" class="primary" onclick="resetDaftar()">Daftar Lain</button>
    </div>

    <!-- QR CODE DIPAPARKAN TERUS SEBAGAI IMEJ -->
    <div class="qr-section">
      <h3 style="color:#0d9488;margin-bottom:1rem">📱 Imbas Kod QR untuk Daftar Pantas</h3>
      <div style="display:inline-block;padding:1rem;background:#fff;border-radius:0.5rem;box-shadow:0 2px 6px rgba(0,0,0,0.1)">
        <img id="imej-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=file:///C:/Users/User/Desktop/sistem-giliran.html" alt="Kod QR" style="display:block">
      </div>
      <p style="font-size:0.9rem;color:#666;margin-top:0.5rem">Imbas guna kamera telefon → buka halaman daftar</p>
    </div>
  </div>

  <div id="tab-semak" class="card hidden">
    <h2>Semak Status Tiket</h2>
    <div class="form-group">
      <label>Nombor Tiket</label>
      <input type="text" id="nombor-semak" placeholder="Contoh: A001">
    </div>
    <button type="button" class="primary" onclick="cariTiket()">Semak Status</button>
    <div id="hasil-semak" style="margin-top:1rem;text-align:center"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ccmfwuhtrbozpaarekm.supabase.co";
const SUPABASE_KEY = "sb_publishable_r8i1N852pOzuxeOboXNW2g_aDfzF9ld";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showTab(nama) {
  document.querySelectorAll('[id^="tab-"]').forEach(tab => tab.classList.add('hidden'));
  document.getElementById('tab-' + nama).classList.remove('hidden');
}

document.getElementById('form-daftar').addEventListener('submit', async e => {
  e.preventDefault();
  const nama = document.getElementById('nama-pesakit').value.trim() || 'Pesakit';
  try {
    const { data: nombor, error: r1 } = await supabase.rpc('get_next_ticket_number');
    if (r1) throw r1;
    const tiket = 'A' + String(nombor).padStart(3, '0');
    const { error: r2 } = await supabase.from('tickets').insert({ticket_number: tiket, preferred_name: nama});
    if (r2) throw r2;
    document.getElementById('form-daftar').classList.add('hidden');
    document.getElementById('hasil-daftar').style.display = 'block';
    document.getElementById('nombor-keluar').textContent = tiket;
  } catch (err) {
    alert('Ralat: ' + err.message);
  }
});

function resetDaftar() {
  document.getElementById('form-daftar').reset();
  document.getElementById('form-daftar').classList.remove('hidden');
  document.getElementById('hasil-daftar').style.display = 'none';
}

async function cariTiket() {
  const no = document.getElementById('nombor-semak').value.trim().toUpperCase();
  if (!no) { alert('Masukkan nombor tiket'); return; }
  try {
    const { data, error } = await supabase.from('tickets').select('status').eq('ticket_number', no).maybeSingle();
    if (error) throw error;
    if (!data) {
      document.getElementById('hasil-semak').innerHTML = '<p style="color:red">Tidak dijumpai</p>';
      return;
    }
    const st = {waiting:'⏳ Menunggu',called:'📢 Dipanggil',completed:'✅ Selesai'};
    document.getElementById('hasil-semak').innerHTML = '<p style="font-size:1.2rem;font-weight:bold">' + (st[data.status] || data.status) + '</p>';
  } catch (err) {
    alert('Ralat: ' + err.message);
  }
}

// Kemas kini QR dengan alamat sebenar
window.addEventListener('load', function() {
  const alamatSebenar = "https://klinikgarnet.github.io/klinik-garnet/";
const imejQR = document.getElementById('imej-qr');
if (imejQR) {
  imejQR.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(alamatSebenar);
  }
});
</script>

</body>
</html>
